name: Playwright Python Tests

# TRIGGERS: when should this pipeline run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manually running the workflow from GitHub UI

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Get your code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browsers + OS-level dependencies
      - name: Install Playwright browsers
        run: playwright install --with-deps

      # 5. Run the test suite
      #    HEADLESS=true overrides --headed from pytest.ini so the
      #    browser runs silently on GitHub's display-less runner
      - name: Run tests
        env:
          HEADLESS: "true"
        run: pytest --html=report.html --self-contained-html

      # 6. Upload the HTML report even if tests fail so you can download
      #    and inspect it from the Actions tab
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: report.html
          retention-days: 7